# Blueprint do Render: a API (api/). Render > New > Blueprint > escolher este repositório.
# As variáveis com sync: false são pedidas na criação (valores em api/.env.example e docs/ARQUITETURA.md, seção Deploy).
# Migrations não rodam sozinhas: depois de cada deploy que traga migration nova, rode `npm run db:deploy` (ver docs).
services:
  - type: web
    name: one-take-api
    runtime: node
    # Mesma região do banco do Supabase (us-west-2, Oregon): menos latência em cada consulta.
    region: oregon
    plan: free
    rootDir: api
    # prisma e typescript são devDependencies: o build precisa delas.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # URL do site na Vercel (sem barra no fim); várias separadas por vírgula.
      - key: CORS_ORIGIN
        sync: false
